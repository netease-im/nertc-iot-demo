<!DOCTYPE html>
<html>
<head>
    <title>Network Configuration</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="referrer no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style type="text/css">
        /* ========== Base Styles ========== */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(160deg, #eef2f7 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: #1a202c;
        }
        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        /* ========== Header ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .header .title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
        }
        .header .title .logo {
            font-size: 22px;
        }

        /* ========== Language Switcher ========== */
        .language-switch select {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e0;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        /* ========== Card ========== */
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* ========== Tab Styles ========== */
        .tabs {
            display: flex;
            margin: 0;
            padding: 0 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 14px 8px;
            cursor: pointer;
            color: #718096;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab:hover {
            color: #4a5568;
        }
        .tab.active {
            color: #007bff;
            border-bottom-color: #007bff;
        }
        .tab-content {
            display: none;
            padding: 24px;
        }
        .tab-content.active {
            display: block;
        }

        /* ========== Form Elements ========== */
        form p {
            margin: 0 0 18px;
        }
        form p:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
        }
        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus, select:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }
        /* 自定义下拉箭头 */
        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23718096' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 36px;
            cursor: pointer;
        }
        input[type="submit"] {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #007bff, #0062db);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
            box-shadow: 0 3px 10px rgba(0, 123, 255, 0.3);
        }
        input[type="submit"]:hover {
            background: linear-gradient(135deg, #006ff5, #0056b3);
        }
        input[type="submit"]:active {
            transform: translateY(1px);
        }
        input[type="submit"]:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
        }
        #remember_bssid, #sleep_mode {
            width: auto;
            margin: 0;
        }

        /* ========== Misc UI ========== */
        h3 {
            margin: 0 0 14px;
            font-size: 17px;
            font-weight: 700;
            color: #1a202c;
        }
        .error {
            color: #e53e3e;
            text-align: center;
            font-size: 14px;
            min-height: 18px;
            margin: 0 0 14px;
        }
        #saved_list_container {
            margin-bottom: 20px;
        }
        #saved_list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        #saved_list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #f7fafc;
            font-size: 14px;
        }
        #saved_list button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 4px;
        }
        .icon-btn {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background: #f7fafc;
            cursor: pointer;
            font-size: 14px;
        }

        /* ========== Toast Message Styles ========== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            min-width: 200px;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }

        /* ========== Responsive ========== */
        @media (max-width: 520px) {
            .app {
                padding: 16px 12px 32px;
            }
            .tab-content {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="title">
                <span class="logo">🌐</span>
                <span data-lang="title">网络配置</span>
            </div>
            <div class="language-switch">
                <select id="language" onchange="changeLanguage()">
                    <option value="en-US">English</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="zh-TW">繁體中文</option>
                    <option value="ja-JP">日本語</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('wifi')" data-lang="wifi_tab">WiFi 配置</div>
                <div class="tab" onclick="switchTab('advanced')" data-lang="advanced_tab">高级选项</div>
            </div>

            <div id="wifi-tab" class="tab-content active">
                <form action="/submit" method="post" onsubmit="submitForm(event)">
                    <div id="saved_list_container" style="display: none;">
                        <h3 data-lang="saved_wifi">已保存的 WiFi</h3>
                        <ul id="saved_list">
                            <li>
                                <span>SSID</span>
                            </li>
                        </ul>
                    </div>
                    <div>
                        <h3 data-lang="new_wifi">新的 WiFi</h3>
                        <p class="error" id="error"></p>
                        <p>
                            <label for="ssid">SSID:</label>
                            <select id="ssid" name="ssid" required>
                                <option value="" disabled selected id="ssid_placeholder">请选择 2.4G Wi-Fi</option>
                            </select>
                        </p>
                        <p>
                            <label for="password" data-lang="password">密码:</label>
                            <input type="password" id="password" name="password">
                        </p>
                        <p>
                            <input type="submit" value="连接" id="button" data-lang-value="connect">
                        </p>
                    </div>
                </form>
            </div>

            <div id="advanced-tab" class="tab-content">
                <form action="/advanced/submit" method="post" onsubmit="submitAdvancedForm(event)">
                    <div>
                        <h3 data-lang="advanced_tab">高级选项</h3>
                        <p class="error" id="advanced_error"></p>

                        <p>
                            <label for="ota_url" data-lang="ota_url">OTA服务器地址:</label>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <input type="text" id="ota_url" name="ota_url" style="flex: 1;">
                                <button type="button" class="icon-btn" onclick="clearOtaUrl()">❌</button>
                            </div>
                        </p>

                        <p style="display: flex; align-items: center; gap: 10px;">
                            <label for="max_tx_power" data-lang="max_tx_power" style="white-space: nowrap;">Wi-Fi发射功率:</label>
                            <select id="max_tx_power" name="max_tx_power">
                                <option value="8">2 dBm</option>
                                <option value="20">5 dBm</option>
                                <option value="28">7 dBm</option>
                                <option value="34">8 dBm</option>
                                <option value="44">11 dBm</option>
                                <option value="52">13 dBm</option>
                                <option value="56">14 dBm</option>
                                <option value="60">15 dBm</option>
                                <option value="66">16 dBm</option>
                                <option value="72">18 dBm</option>
                                <option value="80">20 dBm</option>
                            </select>
                        </p>

                        <p style="display: flex; align-items: center; gap: 10px;">
                            <label for="remember_bssid" style="margin: 0;">
                                <span data-lang="remember_bssid">连接 Wi-Fi 时记住 BSSID</span>
                            </label>
                            <input type="checkbox" id="remember_bssid" name="remember_bssid">
                        </p>

                        <p style="display: flex; align-items: center; gap: 10px;">
                            <label for="sleep_mode" style="margin: 0;">
                                <span data-lang="sleep_mode">启用睡眠模式</span>
                            </label>
                            <input type="checkbox" id="sleep_mode" name="sleep_mode">
                        </p>

                        <p>
                            <input type="submit" value="保存" id="advanced_button" data-lang-value="save">
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        const button = document.getElementById('button');
        const error = document.getElementById('error');
        const ssid = document.getElementById('ssid');

        // Add language translations
        const translations = {
            'zh-CN': {
                title: '网络配置',
                saved_wifi: '已保存的 Wi-Fi',
                new_wifi: '新的 Wi-Fi',
                password: '密码:',
                connect: '连接',
                select_wifi: '请选择 2.4G Wi-Fi',
                wifi_tab: 'Wi-Fi 配置',
                advanced_tab: '高级选项',
                ota_url: '自定义 OTA 地址:',
                max_tx_power: 'Wi-Fi 最大发射功率:',
                remember_bssid: '连接 Wi-Fi 时记住 BSSID',
                sleep_mode: '启用睡眠模式',
                save: '保存'
            },
            'zh-TW': {
                title: '網路設定',
                saved_wifi: '已儲存的 Wi-Fi',
                new_wifi: '新的 Wi-Fi',
                password: '密碼:',
                connect: '連接',
                select_wifi: '請選擇 2.4G Wi-Fi',
                wifi_tab: 'Wi-Fi 設定',
                advanced_tab: '進階選項',
                ota_url: '自定義 OTA 位址:',
                max_tx_power: 'Wi-Fi 最大發射功率:',
                remember_bssid: '連接 Wi-Fi 時記住 BSSID',
                sleep_mode: '啟用睡眠模式',
                save: '儲存'
            },
            'en-US': {
                title: 'Network Configuration',
                saved_wifi: 'Saved Wi-Fi',
                new_wifi: 'New Wi-Fi',
                password: 'Password:',
                connect: 'Connect',
                select_wifi: 'Select 2.4G Wi-Fi',
                wifi_tab: 'Wi-Fi Config',
                advanced_tab: 'Advanced',
                ota_url: 'Custom OTA URL:',
                max_tx_power: 'Wi-Fi Max TX Power:',
                remember_bssid: 'Remember BSSID when connecting to Wi-Fi',
                sleep_mode: 'Enable Sleep Mode',
                save: 'Save'
            },
            'ja-JP': {
                title: 'ネットワーク設定',
                saved_wifi: '保存済みのWi-Fi',
                new_wifi: '新しいWi-Fi',
                password: 'パスワード:',
                connect: '接続',
                select_wifi: '2.4G Wi-Fiを選択',
                wifi_tab: 'Wi-Fi設定',
                advanced_tab: '詳細設定',
                ota_url: 'カスタムOTAアドレス:',
                max_tx_power: 'Wi-Fi最大送信電力:',
                remember_bssid: 'Wi-Fi接続時にBSSIDを記憶する',
                sleep_mode: 'スリープモードを有効にする',
                save: '保存'
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('language').value;
            // 检查语言值是否合法
            if (!translations[lang]) {
                console.warn(`不支持的语言: ${lang}，默认使用中文`);
                document.getElementById('language').value = 'zh-CN';
                return changeLanguage();
            }
            // Set page title
            document.title = translations[lang].title;
            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                element.textContent = translations[lang][key];
            });
            document.querySelectorAll('[data-lang-value]').forEach(element => {
                const key = element.getAttribute('data-lang-value');
                element.value = translations[lang][key];
            });
            // 更新 SSID 下拉框占位文案
            updateSsidPlaceholder();
            // Save language preference
            localStorage.setItem('preferred_language', lang);
        }

        function renderSavedList(data) {
            const savedListContainer = document.getElementById('saved_list_container');
            const savedList = document.getElementById('saved_list');
            savedList.innerHTML = '';
            data.forEach((ssid, index) => {
                const li = document.createElement('li');
                let html = `<span>${ssid}</span>`;
                // Only add priority and delete buttons after the first item
                if (index > 0) {
                    html += ` <span>
                        <button type="button" onclick="setDefaultItem(this, ${index})">⬆️</button>
                        <button type="button" onclick="deleteItem(this, ${index})">❌</button>
                    </span>`;
                } else {
                    html += ` <span><button type="button" onclick="deleteItem(this, ${index})">❌</button></span>`;
                }
                li.innerHTML = html;
                savedList.appendChild(li);
            });
            if (data.length > 0) {
                savedListContainer.style.display = 'block';
            } else {
                savedListContainer.style.display = 'none';
            }
        }

        // Delete one item from the list
        function deleteItem(item, index) {
            // disable the button
            item.disabled = true;
            // /saved/delete?index=INDEX
            fetch('/saved/delete?index=' + index)
                .then(response => response.json())
                .then(data => {
                    loadSavedList();
                });
        }

        function setDefaultItem(item, index) {
            item.disabled = true;
            fetch('/saved/set_default?index=' + index)
                .then(response => response.json())
                .then(data => {
                    loadSavedList();
                });
        }

        // Load saved ssid and password list
        function loadSavedList() {
            fetch('/saved/list')
                .then(response => response.json())
                .then(data => {
                    renderSavedList(data);
                });
        }

        // 获取当前语言下“选择 Wi-Fi”的占位文案
        function getSelectWifiText() {
            const lang = document.getElementById('language').value;
            return translations[lang].select_wifi;
        }

        // 更新 SSID 下拉框占位 option 文案
        function updateSsidPlaceholder() {
            const ph = document.getElementById('ssid_placeholder');
            if (ph) {
                ph.textContent = getSelectWifiText();
            }
        }

        // 加载可用 Wi-Fi 网络，填充进 SSID 下拉框
        function loadAPList() {
            if (button.disabled) {
                return;
            }
            // 记录刷新前选中的 SSID，刷新后尽量保持选中
            const prevSelected = ssid.value;

            fetch('/scan')
                .then(response => response.json())
                .then(data => {
                    // 兼容 /scan 返回数组或 {aps:[...]} 两种结构
                    const aps = data.aps || data || [];
                    // 重建下拉 options
                    ssid.innerHTML = '';
                    const ph = document.createElement('option');
                    ph.value = '';
                    ph.disabled = true;
                    ph.id = 'ssid_placeholder';
                    ph.textContent = getSelectWifiText();
                    ssid.appendChild(ph);

                    aps.forEach(ap => {
                        const opt = document.createElement('option');
                        opt.value = ap.ssid;
                        opt.textContent = ap.ssid + ' · ' + ap.rssi + ' dBm · ' + (ap.authmode === 0 ? '🌐' : '🔒');
                        ssid.appendChild(opt);
                    });

                    // 刷新后若原选中的 SSID 仍在列表则保持选中，否则回到占位
                    if (prevSelected && aps.some(a => a.ssid === prevSelected)) {
                        ssid.value = prevSelected;
                    } else {
                        ssid.value = '';
                    }
                    setTimeout(loadAPList, 5000);
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        // Set initial language
        document.addEventListener('DOMContentLoaded', () => {
            // 从 URL 参数中获取语言设置
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');

            // 获取浏览器语言
            const browserLang = navigator.language || navigator.userLanguage;

            // 语言映射表，将浏览器语言代码映射到支持的语言代码
            const languageMap = {
                'zh': 'zh-CN',    // 简体中文
                'zh-CN': 'zh-CN', // 简体中文
                'zh-TW': 'zh-TW', // 繁体中文
                'zh-HK': 'zh-TW', // 繁体中文（香港）
                'ja': 'ja-JP',    // 日语
                'ja-JP': 'ja-JP', // 日语
                'en': 'en-US',    // 英语
                'en-US': 'en-US', // 英语
                'en-GB': 'en-US', // 英语（英国）
                'en-CA': 'en-US', // 英语（加拿大）
                'en-AU': 'en-US'  // 英语（澳大利亚）
            };

            // 获取支持的语言代码
            const getSupportedLanguage = (lang) => {
                // 首先尝试完全匹配
                if (languageMap[lang]) {
                    return languageMap[lang];
                }
                // 然后尝试只匹配主语言代码（例如 'zh' 而不是 'zh-CN'）
                const mainLang = lang.split('-')[0];
                if (languageMap[mainLang]) {
                    return languageMap[mainLang];
                }
                // 如果都不匹配，返回英语
                return 'en-US';
            };

            // 优先使用 URL 参数的语言设置，其次是本地存储的设置，最后是浏览器语言设置
            const savedLang = langParam ||
                             localStorage.getItem('preferred_language') ||
                             getSupportedLanguage(browserLang);

            document.getElementById('language').value = savedLang;
            changeLanguage();
            loadSavedList();
            loadAPList();
            loadAdvancedConfig();
        });

        // 监听 pageshow 事件以处理浏览器返回键
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadSavedList();
            } else {
                // 正常加载时已处理
            }
        });

        async function submitForm(event) {
            event.preventDefault();
            button.disabled = true;
            error.textContent = '';

            const ssidValue = ssid.value;
            const passwordValue = document.getElementById('password').value;

            const payload = {
                ssid: ssidValue,
                password: passwordValue
            };

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || '连接失败');
                }

                // 连接成功，跳转到完成页面
                button.disabled = false;
                window.location.href = '/done.html';
            } catch (err) {
                error.textContent = err.message;
                button.disabled = false;
            }
        }

        function switchTab(tabName) {
            // 隐藏所有标签页内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            // 移除所有标签页的active类
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            // 显示选中的标签页内容
            document.getElementById(tabName + '-tab').classList.add('active');
            // 激活选中的标签页
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
        }

        async function submitAdvancedForm(event) {
            event.preventDefault();
            const advancedButton = document.getElementById('advanced_button');
            const advancedError = document.getElementById('advanced_error');
            advancedButton.disabled = true;
            advancedError.textContent = '';

            const config = {
                ota_url: document.getElementById('ota_url').value,
                max_tx_power: parseInt(document.getElementById('max_tx_power').value),
                remember_bssid: document.getElementById('remember_bssid').checked,
                sleep_mode: document.getElementById('sleep_mode').checked
            };

            try {
                const response = await fetch('/advanced/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || '保存失败');
                }

                advancedButton.disabled = false;
                showToast('配置已保存');
            } catch (err) {
                advancedError.textContent = err.message;
                advancedButton.disabled = false;
            }
        }

        // 显示提示框
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 加载高级配置
        async function loadAdvancedConfig() {
            try {
                const response = await fetch('/advanced/config');
                const data = await response.json();

                if (data.ota_url) {
                    document.getElementById('ota_url').value = data.ota_url;
                }
                if (data.max_tx_power) {
                    document.getElementById('max_tx_power').value = data.max_tx_power;
                }
                if (data.remember_bssid !== undefined) {
                    document.getElementById('remember_bssid').checked = data.remember_bssid;
                }
                if (data.sleep_mode !== undefined) {
                    document.getElementById('sleep_mode').checked = data.sleep_mode;
                }
            } catch (error) {
                console.error('Error loading advanced config:', error);
            }
        }

        // 清空OTA地址
        function clearOtaUrl() {
            document.getElementById('ota_url').value = '';
        }
    </script>
